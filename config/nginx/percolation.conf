# 拾记凝境（Percolation 网页端）：https://stars-page.com/Percolation/
# 由星页站点的 stars-page.com 443 server 引入（/etc/nginx/sites-available/star-page）：
#   include snippets/percolation.conf;
# 必须写在 include snippets/star-page-locations.conf 之前的同一个 server 里。
# 同域挂载是为了复用星页登录 cookie（sp_session，path=/），后端拿它向星页 /api/auth/me 换账号。
#
# 同步：cp config/nginx/percolation.conf /etc/nginx/snippets/ && nginx -t && systemctl reload nginx

location = /Percolation { return 301 /Percolation/; }
location = /percolation { return 301 /Percolation/; }
location ^~ /percolation/ { return 301 /Percolation/; }

# 末尾带斜杠的 proxy_pass 会去掉 /Percolation 前缀，后端按根路径提供网页与 /v1/*，网页里全用相对路径。
location ^~ /Percolation/ {
    proxy_pass http://127.0.0.1:8710/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 一次询问要走路由、召回、核验、可能的候选区探查，慢的时候几十秒
    proxy_read_timeout 180s;
    client_max_body_size 1m;
}
