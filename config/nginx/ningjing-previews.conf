# 拾记凝境界面备选方案预览（代码 alternatives/product-ui/，服务 percolation-ui-previews.service）。
# 挂在公网 80 端口，避免云安全组未放行 3011-3015。正式版在 https://stars-page.com/Percolation/。
# 只应被「IP 直连」的 80 default_server 引入，不要挂到 stars-page.com。
# 同步：cp config/nginx/ningjing-previews.conf /etc/nginx/snippets/ && nginx -t && systemctl reload nginx

location = /ningjing { return 301 /ningjing/; }
location = /ningjing/ {
    proxy_pass http://127.0.0.1:3011/_hub;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /ningjing/ink { return 301 /ningjing/ink/; }
location /ningjing/ink/ {
    proxy_pass http://127.0.0.1:3011/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /ningjing/nordic { return 301 /ningjing/nordic/; }
location /ningjing/nordic/ {
    proxy_pass http://127.0.0.1:3012/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /ningjing/editorial { return 301 /ningjing/editorial/; }
location /ningjing/editorial/ {
    proxy_pass http://127.0.0.1:3013/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /ningjing/zen { return 301 /ningjing/zen/; }
location /ningjing/zen/ {
    proxy_pass http://127.0.0.1:3014/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location = /ningjing/stream { return 301 /ningjing/stream/; }
location /ningjing/stream/ {
    proxy_pass http://127.0.0.1:3015/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /ningjing/shared/ {
    proxy_pass http://127.0.0.1:3011/shared/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
