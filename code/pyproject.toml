[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "percolation"
version = "0.1.0"
description = "Percolation 个人碎片记忆系统，以及可复用的轻量 Agent 内核 agentkit"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyyaml>=6.0",
  "zstandard>=0.23",
  "opentelemetry-proto>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
obs = ["duckdb>=1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentkit*", "percolation*"]

[tool.setuptools.package-data]
percolation = ["prompts/*.md", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
